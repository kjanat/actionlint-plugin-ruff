[package]
name         = "actionlint-plugin-ruff-component"
version      = "0.3.0"
edition      = "2024"
rust-version = "1.99"
publish      = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "component-metadata"
path = "src/bin/metadata.rs"

[[bin]]
name = "componentize"
path = "src/bin/componentize.rs"

[dependencies]
actionlint-extension-api = { git = "https://github.com/kjanat/actionlint", rev = "9c5587e4aa1557688c6a06d86db9a3d9b792da5d" }
actionlint-plugin-ruff   = { path = "../..", default-features = false }
serde_json               = "1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
actionlint-extension-api = { git = "https://github.com/kjanat/actionlint", rev = "9c5587e4aa1557688c6a06d86db9a3d9b792da5d", features = [
  "package"
] }
wit-component            = "0.263.0"

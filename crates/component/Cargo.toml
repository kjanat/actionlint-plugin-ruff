[package]
name         = "actionlint-plugin-ruff-component"
version      = "0.1.0"
edition      = "2024"
rust-version = "1.98"
publish      = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "component-metadata"
path = "src/bin/metadata.rs"

[[bin]]
name = "componentize"
path = "src/bin/componentize.rs"

[dependencies]
actionlint-plugin-ruff = { path = "../..", default-features = false }
serde_json             = "1.0"
sha2                   = "0.10"
wit-bindgen            = "0.63"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wit-component = "0.262.0"

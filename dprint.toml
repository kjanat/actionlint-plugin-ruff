#:schema ./dprint.schema.json

extends  = ["https://raw.githubusercontent.com/kjanat/kjanat/refs/heads/master/configs/dprint.remote.json"]
# The vendored SDK must match its upstream snapshot byte for byte.
excludes = ["vendor/**"]

[markdown]
textWrap  = "maintainAndWrap"
lineWidth = 120

[exec]
cwd = "${configDir}"

[[exec.commands]]
command = "rustfmt --edition 2024 --config imports_granularity=item"
exts    = ["rs"]

[[exec.commands]]
cwd           = "${configDir}/tests/wazero"
command       = "gofmt -s"
exts          = ["go"]
cacheKeyFiles = ["go.mod"]

#:schema https://raw.githubusercontent.com/rvben/rumdl/refs/tags/v0.2.79/rumdl.schema.json

[global]
respect-gitignore = true

flavor = "gfm"

[MD003]
style = "atx"

[MD004]
style = "consistent"

[MD013]
line-length = 120
code-blocks = false
tables      = false
headings    = true

[MD044]
names       = ["rumdl", "Markdown", "GitHub"]
code-blocks = false

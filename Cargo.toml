[package]
name          = "actionlint-plugin-ruff"
version       = "0.1.0"
edition       = "2024"
rust-version  = "1.97"
description   = "Hermetic Ruff engine for actionlint, with a core WebAssembly JSON ABI"
documentation = "https://github.com/kjanat/actionlint-plugin-ruff/blob/master/docs/plugin-contract.md"
homepage      = "https://github.com/kjanat/actionlint-plugin-ruff"
repository    = "https://github.com/kjanat/actionlint-plugin-ruff"
license       = "MIT"
publish       = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ruff_db             = { git = "https://github.com/astral-sh/ruff", rev = "5b27c1ccfaa230fb195855f5cf3404a21e3379cd" }
ruff_linter         = { git = "https://github.com/astral-sh/ruff", rev = "5b27c1ccfaa230fb195855f5cf3404a21e3379cd" }
ruff_python_ast     = { git = "https://github.com/astral-sh/ruff", rev = "5b27c1ccfaa230fb195855f5cf3404a21e3379cd" }
ruff_python_codegen = { git = "https://github.com/astral-sh/ruff", rev = "5b27c1ccfaa230fb195855f5cf3404a21e3379cd" }
ruff_python_index   = { git = "https://github.com/astral-sh/ruff", rev = "5b27c1ccfaa230fb195855f5cf3404a21e3379cd" }
ruff_python_parser  = { git = "https://github.com/astral-sh/ruff", rev = "5b27c1ccfaa230fb195855f5cf3404a21e3379cd" }
ruff_ranged_value   = { git = "https://github.com/astral-sh/ruff", rev = "5b27c1ccfaa230fb195855f5cf3404a21e3379cd" }
ruff_source_file    = { git = "https://github.com/astral-sh/ruff", rev = "5b27c1ccfaa230fb195855f5cf3404a21e3379cd" }
ruff_workspace      = { git = "https://github.com/astral-sh/ruff", rev = "5b27c1ccfaa230fb195855f5cf3404a21e3379cd", features = ["schemars"] }
schemars            = "1.2.3"
serde               = { version = "1.0", features = ["derive"] }
serde_json          = "1.0"

[patch.crates-io]
# Ruff's browser clock pulls in JS bindings even though linting never uses it.
# The core module has no clock imports; unexpected clock access traps on wasm32.
web-time = { path = "crates/web-time" }

[profile.dev]
debug = 0

[profile.release]
opt-level     = "s"
strip         = "debuginfo"
lto           = "thin"
panic         = "abort"
codegen-units = 1

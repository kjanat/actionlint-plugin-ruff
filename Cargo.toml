[package]
name          = "actionlint-plugin-ruff"
version       = "0.3.0"
edition       = "2024"
rust-version  = "1.97"
description   = "Run Ruff on actionlint Python snippets through WebAssembly"
documentation = "https://github.com/kjanat/actionlint-plugin-ruff/blob/master/docs/plugin-contract.md"
homepage      = "https://github.com/kjanat/actionlint-plugin-ruff"
repository    = "https://github.com/kjanat/actionlint-plugin-ruff"
license       = "MIT"
publish       = false
default-run   = "ruff-plugin"

[features]
default  = ["core-abi"]
core-abi = []

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "ruff-plugin"
path = "src/main.rs"

[dependencies]
ruff_linter = { version = "0.17.4" }

ruff_db             = { version = "0.0.21" }
ruff_python_ast     = { version = "0.0.21" }
ruff_python_codegen = { version = "0.0.21" }
ruff_python_index   = { version = "0.0.21" }
ruff_python_parser  = { version = "0.0.21" }
ruff_ranged_value   = { version = "0.0.21" }
ruff_source_file    = { version = "0.0.21" }
ruff_workspace      = { version = "0.0.21", features = ["schemars"] }

schemars   = { version = "1.2.3" }
serde      = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }

[workspace]
resolver = "3"
members  = ["crates/component"]
exclude  = ["tests/rust-host"]

[profile.dev]
debug = 0

[profile.release]
opt-level     = "s"
strip         = "debuginfo"
lto           = "thin"
panic         = "abort"
codegen-units = 1

[patch.crates-io]
# Replace Ruff's browser clock dependency so the guest needs no JavaScript imports.
# An unexpected clock call traps on wasm32.
web-time = { path = "crates/web-time" }
